{% extends "base.html" %}
{% block title %}Войти по коду — SyncView{% endblock %}
{% block content %}
<h1>Войти в комнату</h1>

<form method="post">
  {{ form.hidden_tag() }}

  <div class="field">
    {{ form.code.label }}<br>
    {{ form.code() }}
  </div>

  {{ form.submit(class_="btn btn-primary") }}
</form>
{% endblock %}
