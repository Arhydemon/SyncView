{% extends "base.html" %}
{% block title %}Вход — SyncView{% endblock %}

{% block content %}
<h1>Вход</h1>

<form method="post">
  {{ form.hidden_tag() }}

  <div class="field">
    {{ form.user_name.label }}<br>
    {{ form.user_name() }}
  </div>

  <div class="field">
    {{ form.password.label }}<br>
    {{ form.password() }}
  </div>

  {{ form.submit(class_="btn btn-primary") }}
</form>
{% endblock %}
